openapi: 3.0.3
info:
  title: Order Service API
  version: "1.0"
  description: >
    REST-Vertrag für die Order-Ressource der Kodschul-Bestell-Plattform.
    Gilt sprachneutral für die Java- und die Python-Spur.
servers:
  - url: http://localhost:8081
paths:
  /orders:
    get:
      summary: Alle Bestellungen abrufen
      operationId: listOrders
      responses:
        "200":
          description: Liste der Bestellungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: Neue Bestellung anlegen
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: Bestellung angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Ungültige Eingabe (z. B. quantity < 1)
  /orders/{id}:
    get:
      summary: Einzelne Bestellung abrufen
      operationId: getOrder
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Gefundene Bestellung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Bestellung nicht gefunden
    put:
      summary: Bestellung aktualisieren
      operationId: updateOrder
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "200":
          description: Aktualisierte Bestellung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Ungültige Eingabe
        "404":
          description: Bestellung nicht gefunden
    delete:
      summary: Bestellung löschen
      operationId: deleteOrder
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "204":
          description: Erfolgreich gelöscht
        "404":
          description: Bestellung nicht gefunden
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    NewOrder:
      type: object
      required: [customerName, itemName, quantity]
      properties:
        customerName:
          type: string
          minLength: 1
        itemName:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
    Order:
      allOf:
        - $ref: "#/components/schemas/NewOrder"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [NEW, CONFIRMED, CANCELLED]
            createdAt:
              type: string
              format: date-time
